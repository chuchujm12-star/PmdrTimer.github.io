<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Pomodoro</title>
<style>
:root{
  color-scheme:dark;
  --bg:#141518; --fg:#e9e9e6; --muted:#9a9b9e; --accent:#e4e4e4; --track:rgba(233,233,230,.10); --glow:rgba(233,233,230,.16);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-phase="break"]{ --bg:#24262b; --fg:#ececec; --muted:#a3a3a5; --accent:#d2d2d2; --track:rgba(236,236,236,.10); --glow:rgba(236,236,236,.12); }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--fg); transition:background .6s, color .6s;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex; align-items:center; justify-content:center;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
  background-image:
    radial-gradient(1.5px 1.5px at 10% 15%, var(--fg) 60%, transparent 61%),
    radial-gradient(1px 1px at 82% 10%, var(--fg) 60%, transparent 61%),
    radial-gradient(1px 1px at 25% 78%, var(--fg) 60%, transparent 61%),
    radial-gradient(1.5px 1.5px at 90% 70%, var(--fg) 60%, transparent 61%),
    radial-gradient(1px 1px at 55% 92%, var(--fg) 60%, transparent 61%),
    radial-gradient(1px 1px at 70% 28%, var(--fg) 60%, transparent 61%),
    radial-gradient(1px 1px at 6% 52%, var(--fg) 60%, transparent 61%);
}
main{position:relative; width:min(92vw,420px); text-align:center; padding:24px 0}
h1{font-size:1.1rem; font-weight:600; margin:0 0 20px; color:var(--muted); letter-spacing:.01em}
.dial{width:min(62vw,250px); aspect-ratio:1; margin:0 auto}
svg{width:100%; height:100%; filter:drop-shadow(0 0 16px var(--glow))}
.disc{fill:var(--track); stroke:var(--muted); stroke-opacity:.4; stroke-width:1}
.lit{fill:var(--fg); transition:fill .6s}
.craters circle{fill:var(--bg); opacity:.14}
.read{display:flex; flex-direction:column; align-items:center; margin-top:22px}
.clock{display:flex; align-items:baseline; justify-content:center; gap:8px}
.time{font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Comic Neue",cursive,sans-serif; font-size:clamp(3.6rem,20vw,5.6rem); font-weight:800; font-variant-numeric:tabular-nums; line-height:1}
.time span{display:inline-block}
.time span.flip{animation:roll .45s cubic-bezier(.2,.8,.2,1)}
@keyframes roll{0%{transform:translateY(-55%) scale(.85);opacity:0;filter:blur(3px);color:var(--accent)}60%{opacity:1;color:var(--accent)}100%{transform:none;opacity:1;filter:none;color:var(--fg)}}
@media (prefers-reduced-motion: reduce){.time span.flip{animation:none}}
.ms{font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Comic Neue",cursive,sans-serif; font-size:clamp(1.4rem,7vw,2rem); font-weight:600; font-variant-numeric:tabular-nums; color:var(--muted); width:3ch; text-align:left}
.label{margin-top:10px; font-size:1.15rem; color:var(--fg)}
.moonname{margin-top:4px; font-size:.95rem; color:var(--muted)}
.controls{display:flex; gap:10px; justify-content:center; margin-top:26px; flex-wrap:wrap}
button{
  font:inherit; font-weight:600; font-size:1rem; padding:12px 22px; border-radius:999px; cursor:pointer;
  border:2px solid var(--fg); background:transparent; color:var(--fg);
}
button.main{background:var(--accent); border-color:var(--accent); color:var(--bg); min-width:120px}
button:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.ask{position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.55); padding:20px; z-index:20}
.ask.open{display:flex}
.box{background:var(--bg); color:var(--fg); border:2px solid var(--fg); border-radius:18px; padding:24px; max-width:360px; text-align:center}
.box p{margin:0 0 18px; font-size:1.05rem; line-height:1.4}
.row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
.count{margin-top:22px; color:var(--muted); font-size:.95rem}
</style>
</head>
<body>
<main>
  <h1>Temporizador Pomodoro</h1>
  <div class="dial">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <defs><clipPath id="litClip"><path id="litClipPath" d=""/></clipPath></defs>
      <circle class="disc" cx="100" cy="100" r="92"/>
      <path class="lit" id="lit" d=""/>
      <g class="craters" clip-path="url(#litClip)">
        <circle cx="70" cy="70" r="14"/><circle cx="120" cy="116" r="20"/><circle cx="85" cy="142" r="9"/><circle cx="136" cy="62" r="8"/><circle cx="55" cy="108" r="6"/>
      </g>
    </svg>
  </div>
  <div class="read">
    <div class="clock">
      <div class="time" id="time" role="timer" aria-live="off">50:00</div>
      <div class="ms" id="ms">.00</div>
    </div>
    <div class="label" id="label">Concentración</div>
    <div class="moonname" id="moonName">Luna nueva</div>
  </div>
  <div class="controls">
    <button class="main" id="start">Empezar</button>
    <button id="skip">Saltar fase</button>
    <button id="reset">Reiniciar</button>
  </div>
  <div class="count" id="count">Pomodoros completados: 0</div>
</main>
<div class="ask" id="ask" role="dialog" aria-modal="true" aria-labelledby="askText">
  <div class="box">
    <p id="askText">¿Seguro que quieres saltar la fase? Puedes aprovechar un poco más de tiempo.</p>
    <div class="row">
      <button class="main" id="askNo">Seguir aquí</button>
      <button id="askYes">Saltar fase</button>
    </div>
  </div>
</div>
<script>
(function(){
  var FOCUS = 50*60, BREAK = 10*60;
  var phase = "focus", total = FOCUS, remaining = FOCUS, remMs = FOCUS*1000, endAt = 0, timer = null, done = 0, audio = null, prev = "", lastD = null;
  var $ = function(id){ return document.getElementById(id); };

  function fmt(s){
    var m = Math.floor(s/60), r = s%60;
    return (m<10?"0":"")+m+":"+(r<10?"0":"")+r;
  }
  function showTime(s){
    var el = $("time");
    if(el.children.length !== s.length){
      el.innerHTML = "";
      for(var k = 0; k < s.length; k++) el.appendChild(document.createElement("span"));
      prev = "";
    }
    for(var i = 0; i < s.length; i++){
      var sp = el.children[i];
      if(sp.textContent !== s[i]){
        sp.textContent = s[i];
        if(prev){ sp.classList.remove("flip"); void sp.offsetWidth; sp.classList.add("flip"); }
      }
    }
    prev = s;
  }
  // f: 0 = luna nueva, 0.5 = luna llena, 1 = luna nueva
  function moonPath(f){
    if(f <= .002 || f >= .998) return "";
    var c = Math.cos(2*Math.PI*f), rx = (92*Math.abs(c)).toFixed(2), waxing = f < .5;
    var limb = waxing ? "M100 8A92 92 0 0 1 100 192" : "M100 8A92 92 0 0 0 100 192";
    var sweep = waxing ? (c > 0 ? 0 : 1) : (c > 0 ? 1 : 0);
    return limb + "A" + rx + " 92 0 0 " + sweep + " 100 8Z";
  }
  function moonName(f){
    if(f < .03 || f >= .97) return "Luna nueva";
    if(f < .22) return "Luna creciente";
    if(f < .28) return "Cuarto creciente";
    if(f < .47) return "Gibosa creciente";
    if(f < .53) return "Luna llena";
    if(f < .72) return "Gibosa menguante";
    if(f < .78) return "Cuarto menguante";
    return "Luna menguante";
  }
  function render(){
    showTime(fmt(remaining));
    $("ms").textContent = "." + ("0" + Math.floor((remMs % 1000)/10)).slice(-2);
    var p = Math.min(1, Math.max(0, 1 - remMs/(total*1000)));
    var f = phase === "focus" ? p*.5 : .5 + p*.5;
    var d = moonPath(f);
    if(d !== lastD){
      lastD = d;
      $("lit").setAttribute("d", d);
      $("litClipPath").setAttribute("d", d);
      $("moonName").textContent = moonName(f);
    }
    $("label").textContent = phase === "focus" ? "Concentración" : "Descanso";
    $("count").textContent = "Pomodoros completados: " + done;
    document.documentElement.setAttribute("data-phase", phase);
    document.title = fmt(remaining) + " · " + (phase === "focus" ? "Concentración" : "Descanso");
  }

  function ac(){
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    return audio;
  }
  function tone(f, t, vol, dur, type){
    var o = audio.createOscillator(), g = audio.createGain(), n = audio.currentTime + t;
    o.type = type || "sine"; o.frequency.value = f;
    o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(.001, n + dur);
    o.start(n); o.stop(n + dur);
  }
  function chime(){ try{ ac(); tone(523, 0, .25, .5, "triangle"); tone(784, .15, .25, .5, "triangle"); }catch(e){} }
  function pauseChime(){ try{ ac(); tone(784, 0, .25, .5, "triangle"); tone(523, .15, .25, .5, "triangle"); }catch(e){} }
  function beep(){ try{ ac(); [0, .25, .5].forEach(function(t){ tone(880, t, .2, .2); }); }catch(e){} }
  function clickSound(){
    try{
      ac();
      var n = audio.currentTime;
      [[392, .05], [784, .012]].forEach(function(p){
        var o = audio.createOscillator(), g = audio.createGain();
        o.type = "sine"; o.frequency.value = p[0];
        o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(.0001, n);
        g.gain.exponentialRampToValueAtTime(p[1], n + .03);
        g.gain.exponentialRampToValueAtTime(.0001, n + .7);
        o.start(n); o.stop(n + .75);
      });
    }catch(e){}
  }
  function skipSound(){
    try{
      ac();
      var n = audio.currentTime;
      [[1, .14], [1.5, .05]].forEach(function(p){
        var o = audio.createOscillator(), g = audio.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(330 * p[0], n);
        o.frequency.exponentialRampToValueAtTime(660 * p[0], n + .4);
        o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(.0001, n);
        g.gain.exponentialRampToValueAtTime(p[1], n + .08);
        g.gain.exponentialRampToValueAtTime(.0001, n + .8);
        o.start(n); o.stop(n + .85);
      });
    }catch(e){}
  }

  function setPhase(p){
    phase = p; total = remaining = (p === "focus" ? FOCUS : BREAK); remMs = remaining*1000;
    if(timer) endAt = Date.now() + remMs;
    render();
  }
  function tick(){
    remMs = Math.max(0, endAt - Date.now());
    remaining = Math.floor(remMs/1000);
    if(remMs <= 0){
      beep();
      if(phase === "focus") done++;
      setPhase(phase === "focus" ? "break" : "focus");
      return;
    }
    render();
  }
  function start(){
    try{ ac(); }catch(e){}
    endAt = Date.now() + remMs;
    timer = setInterval(tick, 33);
    chime();
    $("start").textContent = "Pausar";
  }
  function pause(){
    remMs = Math.max(0, endAt - Date.now());
    remaining = Math.floor(remMs/1000);
    clearInterval(timer); timer = null;
    render();
    $("start").textContent = "Continuar";
    pauseChime();
  }
  $("start").onclick = function(){ timer ? pause() : start(); };
  $("reset").onclick = function(){
    clearInterval(timer); timer = null; done = 0;
    $("start").textContent = "Empezar";
    setPhase("focus");
  };
  document.addEventListener("click", function(e){
    var b = e.target.closest && e.target.closest("button");
    if(b && b.id !== "start" && b.id !== "askYes") clickSound();
  });
  function closeAsk(){ $("ask").classList.remove("open"); }
  $("skip").onclick = function(){ $("ask").classList.add("open"); $("askNo").focus(); };
  $("askNo").onclick = closeAsk;
  $("askYes").onclick = function(){ closeAsk(); skipSound(); setPhase(phase === "focus" ? "break" : "focus"); };
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeAsk(); });
  render();
})();
</script>
</body>
</html>
